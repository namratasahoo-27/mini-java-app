version: '3.8'

services:
  mini-java-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mini-java-app:latest
    container_name: mini-java-app
    ports:
      - "8080:8080"
    environment:
      # Server Configuration
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      
      # Database Configuration (external)
      - DATABASE_URL=jdbc:mysql://YOUR_MYSQL_HOST:3306/mini_app_db
      - DB_USERNAME=YOUR_DB_USER
      - DB_PASSWORD=YOUR_DB_PASSWORD
      
      # Redis Configuration (external)
      - REDIS_HOST=YOUR_REDIS_HOST
      - REDIS_PORT=6379
      
      # External Services Configuration
      - EXTERNAL_API_URL=http://YOUR_API_HOST:8080/v1
      - PAYMENT_SERVICE_URL=https://YOUR_PAYMENT_SERVICE/process
      - MONITORING_ENDPOINT=http://YOUR_MONITORING_HOST:9090/metrics
      
      # RabbitMQ Configuration (external)
      - RABBITMQ_HOST=YOUR_RABBITMQ_HOST
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=YOUR_RABBITMQ_USER
      - RABBITMQ_PASSWORD=YOUR_RABBITMQ_PASSWORD
      
      # Application Configuration
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      
      # JVM Configuration
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./uploads:/app/uploads
    
    networks:
      - app-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "netstat -an | grep 8080 | grep LISTEN || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge
