version: '3.8'

services:
  mini-java-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mini-java-app:latest
    container_name: mini-java-app
    ports:
      - "8080:8080"
    environment:
      # Server configuration
      - PORT=8080
      - SERVER_HOST=0.0.0.0
      
      # Database configuration (external service)
      - DB_URL=jdbc:mysql://your-db-host:3306/mini_app_db
      - DB_USERNAME=root
      - DB_PASSWORD=password123
      
      # Redis cache configuration (external service)
      - REDIS_HOST=your-redis-host
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_secret_123
      
      # External API configuration
      - EXTERNAL_API_URL=http://api.example.com:8080/v1
      - EXTERNAL_API_KEY=hardcoded_api_key_12345
      
      # Payment service configuration (external service)
      - PAYMENT_SERVICE_URL=https://payment.internal.company.com/process
      - PAYMENT_SERVICE_USERNAME=payment_user
      - PAYMENT_SERVICE_PASSWORD=payment_secret_456
      
      # RabbitMQ configuration (external service)
      - RABBITMQ_HOST=your-rabbitmq-host
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=rabbitmq_user
      - RABBITMQ_PASSWORD=rabbitmq_secret
      
      # Monitoring configuration (external service)
      - MONITORING_URL=http://monitoring.internal.company.com:9090/metrics
      - MONITORING_USERNAME=monitor_user
      - MONITORING_PASSWORD=monitor_pass
      
      # Security configuration
      - JWT_SECRET=my_super_secret_jwt_key_123456789
      - ENCRYPTION_KEY=encryption_key_hardcoded
      
      # Directory paths
      - CONFIG_DIR=/app/config
      - LOG_DIR=/app/logs
      - TEMP_DIR=/app/temp
      - UPLOAD_DIR=/app/uploads
      
      # JVM options
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
